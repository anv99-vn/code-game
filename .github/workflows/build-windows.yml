name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    name: Build Windows (${{ matrix.variant.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          # Keys use the INI-relative form (the [rendering] section header
          # prepends "rendering/" to each key in project.godot).
          - name: opengl
            rendering_method: gl_compatibility
            driver_key: gl_compatibility/driver.windows
            driver: opengl3_angle
          - name: vulkan
            rendering_method: forward_plus
            driver_key: rendering_device/driver.windows
            driver: vulkan
          - name: directx
            rendering_method: forward_plus
            driver_key: rendering_device/driver.windows
            driver: d3d12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove MCP addon
        run: |
          sed -i '/MCPRuntime=/d' project.godot
          sed -i '/godot_mcp/d' project.godot
          rm -rf addons/godot_mcp

      - name: Configure renderer for ${{ matrix.variant.name }}
        run: |
          set -e
          # Drop any pre-existing renderer/driver lines under [rendering].
          # Keys in project.godot appear without the "rendering/" prefix
          # (that prefix comes from the [rendering] section header).
          sed -i '/^renderer\/rendering_method=/d' project.godot
          sed -i '/^rendering_device\/driver\./d' project.godot
          sed -i '/^gl_compatibility\/driver\./d' project.godot
          # Insert the desired method + driver right after the [rendering] header
          awk -v method="renderer/rendering_method=\"${{ matrix.variant.rendering_method }}\"" \
              -v driver="${{ matrix.variant.driver_key }}=\"${{ matrix.variant.driver }}\"" \
              '
                $0 == "[rendering]" { print; print method; print driver; next }
                { print }
              ' project.godot > project.godot.tmp && mv project.godot.tmp project.godot
          # Rename the exported binary per variant
          sed -i "s|^export_path=\"build/windows/Code-Game.exe\"|export_path=\"build/windows/Code-Game-${{ matrix.variant.name }}.exe\"|" export_presets.cfg
          echo "=== project.godot [rendering] ==="
          grep -A6 '^\[rendering\]' project.godot
          echo "=== export_path ==="
          grep export_path export_presets.cfg

      - name: Wait for Release workflow
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release ${{ github.ref_name }} is ready"
              exit 0
            fi
            echo "Release ${{ github.ref_name }} not ready yet, retrying in 10s (attempt $i/30)..."
            sleep 10
          done
          echo "Release ${{ github.ref_name }} was not created in time" >&2
          exit 1

      - name: Restore .godot import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-imports-${{ matrix.variant.name }}-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg', '**/*.png', '**/*.svg', '**/*.tres', '**/*.res', '**/*.tscn', '**/*.gd', '**/*.ttf', '**/*.otf', '**/*.ogg', '**/*.wav', '**/*.mp3', '**/*.glb', '**/*.gltf', '**/*.obj', '**/*.shader', '**/*.godot') }}
          restore-keys: |
            godot-imports-${{ matrix.variant.name }}-4.7.1-

      - name: Reimport project
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          # With a warm cache this is a fast no-op; cold cache triggers a full reimport.
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --import --quit

      - name: Export game
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          presets_to_export: "Windows Desktop"

      - name: Upload to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "/home/runner/.local/share/godot/builds/Windows Desktop/Code-Game-${{ matrix.variant.name }}.exe" --clobber

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Code-Game-${{ matrix.variant.name }}
          path: "/home/runner/.local/share/godot/builds/Windows Desktop/Code-Game-${{ matrix.variant.name }}.exe"
          if-no-files-found: error
name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Windows Executable
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip dev autoloads before export
        shell: bash
        run: |
          sed -i '/^MCPRuntime=/d' project.godot

      - name: Export main executable (embedded PCK)
        id: export_main
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          presets_to_export: "Windows Desktop"

      - name: Export Assets Core pack
        id: export_assets_core
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          presets_to_export: "Assets Core"

      - name: Create distribution zip
        shell: bash
        run: |
          BUILD_DIR="${{ steps.export_main.outputs.build_directory }}"
          mkdir -p dist/Code-Game
          cp "$BUILD_DIR/Windows Desktop"/* dist/Code-Game/
          if [ -d "$BUILD_DIR/Assets Core" ]; then
            cp "$BUILD_DIR/Assets Core"/* dist/Code-Game/ 2>/dev/null || true
          fi
          cd dist
          7z a -tzip ../Code-Game-${{ github.ref_name }}.zip Code-Game/

      - name: Create Release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generateReleaseNotes: true
          artifacts: dist/Code-Game-${{ github.ref_name }}.zip

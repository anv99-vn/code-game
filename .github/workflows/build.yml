name: Build PCK Packs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build PCK Packs
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip dev autoloads before export
        shell: bash
        run: |
          sed -i '/^MCPRuntime=/d' project.godot

      - name: Export Main PCK
        id: export_main_pck
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          presets_to_export: "Main PCK"

      - name: Export Assets Core PCK
        id: export_assets_core_pck
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          presets_to_export: "Assets Core"

      - name: Create PCK zip
        shell: bash
        run: |
          BUILD_DIR="${{ steps.export_main_pck.outputs.build_directory }}"
          mkdir -p dist/packs
          cp "$BUILD_DIR/Main PCK"/* dist/packs/
          if [ -d "$BUILD_DIR/Assets Core" ]; then
            cp "$BUILD_DIR/Assets Core"/* dist/packs/ 2>/dev/null || true
          fi
          cd dist
          7z a -tzip packs-${{ github.ref_name }}.zip packs/

      - name: Create Release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generateReleaseNotes: true
          artifacts: dist/packs-${{ github.ref_name }}.zip
